[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG implementation with Pinecone and Voyage AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.61.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
